<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Meridian</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <main class="center-screen">
    <section class="login-card">
      <div class="brand"><span class="brand-mark"></span>Meridian</div>
      <h1>Sign in</h1>
      <p class="muted">Enter your work email and we'll take you to your company's login.</p>

      <div id="notice" class="notice hidden" role="alert"></div>

      <form id="hrd-form" novalidate>
        <label for="email">Work email</label>
        <input id="email" class="input" type="email" autocomplete="username" placeholder="you@company.com" required autofocus>
        <button id="continue" class="btn btn-primary" type="submit">Continue</button>
      </form>

      <p class="login-footer">Secured with SAML 2.0 single sign-on</p>
    </section>
  </main>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
